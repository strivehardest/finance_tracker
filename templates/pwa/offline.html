<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f57c00">
    <title>Offline - Finance Tracker</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Quicksand, system-ui, sans-serif;
            background: #f8f9fa;
            color: #333;
            text-align: center;
            padding: 2rem;
        }
        h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
        p { color: #666; margin: 0 0 1.5rem; }
        a {
            color: #fff;
            background: #f57c00;
            text-decoration: none;
            padding: 0.6rem 1.1rem;
            border-radius: 0.5rem;
        }
    </style>
</head>
<body>
    <main>
        <h1>You're offline</h1>
        <p>Reconnect to load your accounts and transactions.</p>
        <a href="{% url 'dashboard' %}">Try again</a>
    </main>
</body>
</html>
