{% extends 'base.html' %}

{% block title %}Log in - Finance Tracker{% endblock %}
{% block body_class %}auth-page{% endblock %}

{% block content %}
<div class="auth-card">
    <div class="text-center mb-4">
        <img src="{% url 'pwa_icon_192' %}" alt="" class="brand-mark mb-3">
        <h1 class="h3 mb-1">Log in</h1>
        <p class="text-muted mb-0">Use your username and password.</p>
    </div>

    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" class="form-control" id="username" name="username" autocomplete="username" required>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <div class="input-group">
                <input type="password" class="form-control" id="password" name="password" autocomplete="current-password" required>
                <button class="btn btn-outline-secondary" type="button" id="togglePassword" aria-label="Show password">
                    <i class="fas fa-eye" id="eyeIcon"></i>
                </button>
            </div>
        </div>

        <div class="mb-3 text-end">
            <a href="{% url 'password_reset' %}" class="small">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary w-100">Log in</button>
    </form>

    <p class="text-center text-muted mt-4 mb-0">
        No account? <a href="{% url 'signup' %}">Sign up</a>
    </p>
</div>

<script>
    const togglePassword = document.getElementById('togglePassword');
    const password = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');

    togglePassword.addEventListener('click', function() {
        const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
        password.setAttribute('type', type);
        eyeIcon.classList.toggle('fa-eye');
        eyeIcon.classList.toggle('fa-eye-slash');
    });
</script>
{% endblock %}
