{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card">
            <div class="card-header">Edit category</div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Name</label>
                        {{ form.name }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Type</label>
                        {{ form.type }}
                    </div>
                    <div class="mb-3">
                        {% include 'accounts/_icon_picker.html' %}
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Color</label>
                        {{ form.color }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Monthly budget (optional)</label>
                        {{ form.budget_limit }}
                    </div>
                    {% if form.errors %}
                        <div class="alert alert-danger">{{ form.errors }}</div>
                    {% endif %}
                    <div class="d-flex gap-2">
                        <a href="{% url 'categories_list' %}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
